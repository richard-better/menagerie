[package]
name = "menagerie"
description = "Menu bar manager for a small fleet of personal machines"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "menagerie"

[lib]
name = "menagerie_app"
path = "src/lib.rs"

[[bin]]
name = "menagerie"
path = "src/main.rs"

# Renders the window and the popover from the example fleet and saves a PNG
# of each, so layout can be checked without driving the real menu bar.
[[bin]]
name = "preview"
path = "src/bin/preview.rs"

[dependencies]
menagerie-fleet = { path = "../fleet" }

# `runtime_shaders` compiles gpui's Metal shaders at runtime, so building
# needs only the Command Line Tools, not the full Xcode.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

anyhow = "1"
futures = "0.3"

# The menu-bar half. tray-icon provides the NSStatusItem and its click
# events; display-info provides monitor bounds with their real origins,
# which gpui 0.2.2's Display::bounds() discards.
tray-icon = "0.24"
# Decodes the menu bar icon; already in the tree through gpui.
png = "0.18"
display-info = "0.5"
raw-window-handle = "0.6"

objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSResponder",
  "NSStatusItem",
  "NSStatusBarButton",
  "NSButton",
  "NSControl",
  "NSView",
  "NSWindow",
  "NSEvent",
  "NSScreen",
  "NSRunningApplication",
  "block2",
] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
menagerie-protocol = { version = "0.1.0", path = "../protocol" }
ureq = { version = "3.5.2", features = ["json"] }
serde_json = "1.0.154"
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "4466c0f", version = "0.2.1", default-features = false }
portable-pty = "0.9.0"
libc = "0.2.191"

[dev-dependencies]
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
